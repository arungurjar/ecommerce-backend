<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger &amp; Co. — General Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ============ NAV ============ -->
<header class="topbar">
  <div class="topbar-inner">
    <a href="#/products" class="brand" data-nav="#/products">
      <span class="brand-mark">&amp;</span>
      <span class="brand-name">Ledger&nbsp;&amp;&nbsp;Co.</span>
    </a>

    <nav class="main-nav">
      <a href="#/products" data-nav="#/products">Catalog</a>
      <a href="#/orders" data-nav="#/orders" class="auth-only">Orders</a>
      <a href="#/admin" data-nav="#/admin" class="admin-only">Admin</a>
    </nav>

    <div class="topbar-actions">
      <a href="#/cart" data-nav="#/cart" class="cart-link auth-only" aria-label="Cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.8h7.2a2 2 0 0 0 2-1.6L20.5 8H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </a>
      <span class="user-chip auth-only" id="userChip"></span>
      <button class="btn btn-ghost auth-only" id="logoutBtn">Log out</button>
      <a href="#/login" data-nav="#/login" class="btn btn-primary guest-only">Log in</a>
    </div>
  </div>
</header>

<main id="app" class="app"></main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ============ TEMPLATES ============ -->

<template id="tpl-auth">
  <section class="auth-screen">
    <div class="auth-card">
      <p class="eyebrow">Members' Ledger</p>
      <h1 class="serif" id="authTitle">Welcome back</h1>
      <p class="auth-sub" id="authSub">Sign in to browse the catalog and place orders.</p>

      <form id="authForm" class="stack">
        <div class="field" id="fieldEmail" hidden>
          <label for="authEmail">Email</label>
          <input type="email" id="authEmail" autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="authUsername">Username</label>
          <input type="text" id="authUsername" autocomplete="username" placeholder="jane_doe" required>
        </div>
        <div class="field">
          <label for="authPassword">Password</label>
          <input type="password" id="authPassword" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <p class="form-error" id="authError" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" id="authSubmit">Sign in</button>
      </form>

      <p class="auth-switch">
        <span id="authSwitchText">New here?</span>
        <button type="button" class="link-btn" id="authSwitchBtn">Create an account</button>
      </p>

      <div class="auth-hint">
        <span class="dot"></span> Demo admin — <strong>admin</strong> / <strong>admin123</strong>
      </div>
    </div>
  </section>
</template>

<template id="tpl-products">
  <section class="catalog">
    <div class="catalog-head">
      <div>
        <p class="eyebrow">The Catalog</p>
        <h1 class="serif">Goods on the shelf</h1>
      </div>
      <div class="catalog-controls">
        <input type="search" id="searchInput" placeholder="Search the catalog…" class="search-input">
        <select id="categoryFilter" class="select-input">
          <option value="">All categories</option>
        </select>
      </div>
    </div>
    <div class="product-grid" id="productGrid"></div>
    <div class="pager" id="pager"></div>
  </section>
</template>

<template id="tpl-cart">
  <section class="receipt-screen">
    <div>
      <p class="eyebrow">Your Basket</p>
      <h1 class="serif">The cart</h1>
    </div>
    <div class="receipt" id="cartReceipt"></div>
  </section>
</template>

<template id="tpl-orders">
  <section class="orders-screen">
    <p class="eyebrow">Ledger History</p>
    <h1 class="serif">Your orders</h1>
    <div class="order-list" id="orderList"></div>
  </section>
</template>

<template id="tpl-admin">
  <section class="admin-screen">
    <p class="eyebrow">Back Office</p>
    <h1 class="serif">Admin desk</h1>

    <div class="tabs">
      <button class="tab active" data-tab="inventory">Inventory</button>
      <button class="tab" data-tab="all-orders">All Orders</button>
    </div>

    <div class="tab-panel" id="panel-inventory">
      <form id="productForm" class="admin-form">
        <input type="hidden" id="editingProductId">
        <div class="field"><label>Name</label><input type="text" id="pName" required></div>
        <div class="field"><label>Category</label><input type="text" id="pCategory" required></div>
        <div class="field"><label>Price (₹)</label><input type="number" step="0.01" min="0" id="pPrice" required></div>
        <div class="field"><label>Stock</label><input type="number" min="0" id="pStock" required></div>
        <div class="field field-wide"><label>Description</label><textarea id="pDescription" rows="2"></textarea></div>
        <div class="field field-wide"><label>Image URL <span class="field-optional">(optional — leave blank to use a category icon)</span></label><input type="url" id="pImageUrl" placeholder="https://…"></div>
        <div class="field-actions">
          <button type="submit" class="btn btn-primary" id="productFormSubmit">Add product</button>
          <button type="button" class="btn btn-ghost" id="cancelEditBtn" hidden>Cancel edit</button>
        </div>
      </form>
      <div class="admin-table-wrap">
        <table class="admin-table" id="adminProductTable">
          <thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="tab-panel" id="panel-all-orders" hidden>
      <div class="order-list" id="adminOrderList"></div>
    </div>
  </section>
</template>

<script src="/js/app.js"></script>
</body>
</html>
